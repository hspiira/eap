# Path filters keep a frontend-only commit from paying for Postgres and pytest,
# and vice versa. The root manifests appear in every filter: they define the
# command surface both jobs run through, so a change there has to be tested.
# The contract job needs both halves, so it runs on either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per branch. A second push supersedes the first instead of leaving two
# to finish in parallel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.gitattributes'
              - '.nvmrc'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.gitattributes'
              - '.nvmrc'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install dependencies
        run: uv sync --group dev

      # Mirrors `pnpm lint:api` from the repo root.
      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Layering (import-linter)
        run: uv run lint-imports

      # Mirrors `pnpm typecheck:api`. The gate is strict for app/domain and
      # prints the advisory per-package ratchet for everything else.
      - name: Type-check (strict gate on app/domain, advisory elsewhere)
        run: uv run python scripts/pyright_gate.py --run app/domain

      # Mirrors `pnpm test:api`.
      - name: Unit tests with coverage gate
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: >
          uv run pytest tests/unit
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=60

      - name: Integration / E2E tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: uv run pytest tests -v --ignore=tests/unit

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Workspace root install: one lockfile covers every Node package.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # These are the same root scripts a developer runs, so a green local run
      # and a green CI run mean the same thing.
      - name: Lint
        run: pnpm lint:web

      - name: Type-check
        run: pnpm typecheck:web

      - name: Unit tests
        run: pnpm test:web

      - name: Build
        run: pnpm build:web

      # The router plugin rewrites routeTree.gen.ts during the build. It is
      # committed, so a stale copy has to fail here the way the contract does.
      - name: Fail if the committed route tree is stale
        run: |
          if ! git diff --exit-code -- apps/web/src/routeTree.gen.ts; then
            echo "::error::apps/web/src/routeTree.gen.ts is out of date. Run 'pnpm build:web' and commit the result."
            exit 1
          fi

  contract:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend deps
        working-directory: apps/api
        run: uv sync --group dev

      # Settings have no defaults, so importing app.main without a .env fails.
      # One file at the root now feeds both apps.
      - name: Seed env for the schema dump
        run: cp .env.example .env

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Regenerate contract and client
        run: pnpm contracts

      - name: Fail if the committed contract or client is stale
        run: |
          if ! git diff --exit-code -- apps/web/src/api/generated/ apps/api/schema/openapi.json; then
            echo "::error::OpenAPI contract or generated client is out of date. Run 'pnpm contracts' from the repo root and commit the result."
            exit 1
          fi
