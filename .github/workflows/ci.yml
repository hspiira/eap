# CI: Lint and test on push and pull_request.
# Satisfies pre-production audit: automated tests on every commit/PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check app tests

      - name: Layering (import-linter)
        run: uv run lint-imports

      - name: Type-check domain (strict gate — zero errors required)
        run: |
          uv run pyright --outputjson > /tmp/pyright.json || true
          uv run python scripts/pyright_gate.py /tmp/pyright.json app/domain

      - name: Type-check full project (advisory ratchet)
        run: |
          uv run python scripts/pyright_gate.py /tmp/pyright.json --report-only

      - name: Unit tests with coverage gate
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: >
          uv run pytest tests/unit
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=60

      - name: Integration / E2E tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: uv run pytest tests -v --ignore=tests/unit
