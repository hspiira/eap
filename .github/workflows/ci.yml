# Path filters keep a frontend-only commit from paying for Postgres and pytest,
# and vice versa. The contract job needs both halves, so it runs on either.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eap_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Layering (import-linter)
        run: uv run lint-imports

      - name: Type-check domain (strict gate — zero errors required)
        run: |
          uv run pyright --outputjson > /tmp/pyright.json || true
          uv run python scripts/pyright_gate.py /tmp/pyright.json app/domain

      - name: Type-check full project (advisory ratchet)
        run: uv run python scripts/pyright_gate.py /tmp/pyright.json --report-only

      - name: Unit tests with coverage gate
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: >
          uv run pytest tests/unit
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=60

      # Currently red; drop continue-on-error once it is green so it gates again.
      - name: Integration / E2E tests
        continue-on-error: true
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/eap_test
        run: uv run pytest tests -v --ignore=tests/unit

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  contract:
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install backend deps
        working-directory: apps/api
        run: uv sync --group dev

      # Settings have no defaults, so importing app.main without a .env fails.
      - name: Seed env for the schema dump
        working-directory: apps/api
        run: cp .env.sample .env

      - name: Install frontend deps
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Regenerate contract and client
        working-directory: apps/web
        run: pnpm contracts:sync

      - name: Fail if the committed contract or client is stale
        run: |
          if ! git diff --exit-code -- apps/web/src/api/generated/ apps/api/schema/openapi.json; then
            echo "::error::OpenAPI contract or generated client is out of date. Run 'pnpm contracts:sync' in apps/web and commit the result."
            exit 1
          fi
