# apps/api is a Python project (uv); only the Node packages belong here.
packages:
  - apps/web

# pnpm 10 blocks dependency build scripts unless they are named here. esbuild
# is vite's bundler and needs its postinstall, so approve it explicitly rather
# than leaving every install to print an "ignored build scripts" warning.
onlyBuiltDependencies:
  - esbuild
