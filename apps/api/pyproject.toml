[project]
name = "eap"
version = "0.1.0"
description = "Evexía - Employee Assistance Program Management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.1",
    "asyncpg>=0.30.0",
    "bcrypt>=4.2.0",
    "cryptography>=48.0.1",
    "cuid2>=2.0.1",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "msal>=1.36.0",
    "nh3>=0.3.2",
    "openpyxl>=3.1.5",
    "pyjwt>=2.13.0",
    "scalar-fastapi>=1.0.0",
    "sqlalchemy>=2.0.46",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Defaults are only E4/E7/E9/F, so a clean run proved little.
# S110 catches the try/except/pass class of bug this codebase already had;
# ASYNC guards the "no blocking IO in async paths" property.
select = ["E", "F", "I", "B", "UP", "ASYNC", "S110"]
ignore = [
    "E501",   # line length is the formatter's job
    "B008",   # FastAPI's Depends() in a default is the intended idiom
    # StrEnum changes str(Member) from "Class.MEMBER" to the value. 78 enums here
    # are used across logging and f-strings; that is a behaviour change, not a
    # cleanup. Revisit deliberately if wanted.
    "UP042",
    "UP046",  # PEP 695 generics: a real rewrite of the repository base classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S110"]
"alembic/versions/*" = ["E402"]
# Standalone scripts set env/path before importing the app, by design.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
# CI installs with `uv sync --group dev`, which resolves dependency-groups only;
# it does NOT install [project.optional-dependencies]. Test deps must live here,
# or pytest_asyncio/httpx silently go missing and every test errors on import.
dev = [
    "httpx>=0.27.0",
    "import-linter>=2.0",
    "pre-commit>=4.6.2",
    "pyright>=1.1.409",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.14.13",
]

# ----------------------------------------------------------------------------
# Clean-architecture layering enforcement (Phase 0 #C2 / SAD §13.2).
#
# Layers (innermost first):
#   1. domain:         pure entities, value objects, repository interfaces
#   2. application:    use cases; depends on domain only
#   3. infrastructure: SQLAlchemy models, mappers, concrete repos
#   4. api:            FastAPI routes/schemas; orchestrates application layer
#
# Allowed: outer → inner. Forbidden: inner → outer.
# `core` and `shared` are leaf utilities: no inbound restrictions in v1.
#
# Run: `uv run lint-imports`
# ----------------------------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.api",
]

[[tool.importlinter.contracts]]
name = "Application depends only on domain (and core/shared utilities)"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.api",
]
# Tech debt: to remove in Phase 1 (lifecycle collapse) when the
# password-set-token use case is restructured to depend on a domain repository
# interface, with the concrete implementation injected from infrastructure.
ignore_imports = [
    "app.application.use_cases.tenant_use_cases -> app.infrastructure.repositories.password_set_token_repository",
]

[[tool.importlinter.contracts]]
name = "API routes do not import infrastructure directly"
type = "forbidden"
source_modules = ["app.api.routes"]
forbidden_modules = [
    "app.infrastructure",
]
# `app.api.dependencies` is the FastAPI composition root: by design it wires
# infrastructure repositories into routes via Depends(...). The transitive
# edge routes -> dependencies -> infrastructure is the intended pattern.
# The grandfathered direct edges below are existing tech debt; remove them in
# Phase 1 (entity boilerplate + lifecycle collapse) and Phase 2 alongside the
# new entity work. Adding *new* direct edges must fail CI.
ignore_imports = [
    # Composition-root wiring (intentional pattern):
    "app.api.dependencies.audit -> app.infrastructure.repositories.audit_repository",
    "app.api.dependencies.audit -> app.infrastructure.repositories.outbox_repository",
