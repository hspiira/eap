# =============================================================================
# Allevia API Docker Compose
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: development
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./alembic:/app/alembic
      - allevia-data:/app/data
    environment:
      - APP_NAME=Allevia
      - APP_VERSION=0.1.0
      - DEBUG=true
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./data/allevia.db
      - DATABASE_ECHO=false
      - SECRET_KEY=dev-secret-key-change-in-production-at-least-32-chars
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Service (Production with PostgreSQL)
  # ---------------------------------------------------------------------------
  api-prod:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Allevia
      - APP_VERSION=0.1.0
      - DEBUG=false
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://allevia:allevia@db:5432/allevia
      - DATABASE_ECHO=false
      - SECRET_KEY=${SECRET_KEY:?Secret key is required}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles:
      - production

  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=allevia
      - POSTGRES_PASSWORD=allevia
      - POSTGRES_DB=allevia
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allevia -d allevia"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - production

# =============================================================================
# Volumes
# =============================================================================
volumes:
  allevia-data:
    driver: local
  postgres-data:
    driver: local
