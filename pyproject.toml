[project]
name = "eap"
version = "0.1.0"
description = "Evexía - Employee Assistance Program Management API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.1",
    "bcrypt>=4.2.0",
    "beanie>=2.0.1",
    "cuid2>=2.0.1",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "nh3>=0.3.2",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "ruff>=0.14.13",
]
